modules:
  jira:globalPage:
    - key: jsm-health-page
      resource: main
      layout: basic
      resolver:
        function: resolver
      title: JSM Health
  function:
    - key: resolver
      handler: resolvers/index.handler
    - key: agent-consumer
      handler: resolvers/jsmPulseAgentQueueConsumer.handler
      timeoutSeconds: 180
  consumer:
    - key: jsm-pulse-agent-consumer
      queue: jsm-pulse-agent-queue
      function: agent-consumer
resources:
  - key: main
    path: static/jsm-pulse/dist
    tunnel:
      port: 5174
permissions:
  scopes:
    - read:servicedesk-request
    - read:jira-work
    - read:jira-user
    - storage:app
  external:
    fetch:
      backend:
        - address: api.openai.com
  content:
    styles:
      - unsafe-inline
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/c4537cec-f3ae-4942-a399-d93f075aa66e
